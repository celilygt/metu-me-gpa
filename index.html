<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METU ME GPA Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <div class="logo-circle"></div>
            <span>METU</span>
        </div>
        <h1>Mechanical Engineering GPA Calculator</h1>
    </header>

    <main>
        <section class="controls">
            <div class="selector-group">
                <div class="semester-selector">
                    <label for="currentSemester">Completed semesters:</label>
                    <select id="currentSemester">
                        <option value="1">1st Semester</option>
                        <option value="2">2nd Semester</option>
                        <option value="3" selected>3rd Semester</option>
                        <option value="4">4th Semester</option>
                        <option value="5">5th Semester</option>
                        <option value="6">6th Semester</option>
                        <option value="7">7th Semester</option>
                        <option value="8">8th Semester</option>
                    </select>
                </div>
                <div class="surname-selector">
                    <label for="surnameGroup">Surname group:</label>
                    <div class="toggle-group">
                        <button id="groupA" class="toggle-btn active">A — KA</button>
                        <button id="groupB" class="toggle-btn">KA — Z</button>
                    </div>
                </div>
            </div>
            <div class="gpa-summary">
                <div class="gpa-card">
                    <span class="gpa-label">Cumulative GPA</span>
                    <span class="gpa-value" id="cgpa">0.00</span>
                </div>
                <div class="gpa-card">
                    <span class="gpa-label">Total Credits</span>
                    <span class="gpa-value" id="totalCredits">0</span>
                </div>
            </div>
        </section>

        <div id="semesters-container"></div>
    </main>

    <footer>
        <p>METU Mechanical Engineering Department - GPA Calculator</p>
        <p class="grading-info">Grading: AA=4.00 | BA=3.50 | BB=3.00 | CB=2.50 | CC=2.00 | DC=1.50 | DD=1.00 | FD=0.50 |
            FF=0.00</p>
    </footer>

    <script src="curriculum.js"></script>
    <script src="app.js"></script>
</body>

</html>
